# Конфигурация площадки сервиса виртуальных очередей.
#
# [rules]        — константы расчёта из ТЗ (время в секундах, скорость в км/ч, расстояния в метрах).
# [unload_point] — координаты единственной точки разгрузки (WGS84).
# [[stations]]   — станции: идентификатор и координаты (WGS84).
# [assignments]  — закрепление машин за своими станциями: unit_uuid = station_uuid.
#
# Геометрия подобрана так, чтобы нагрузка была реалистичной и неравномерной: станции сгруппированы
# в ~11–14 км от точки разгрузки и в ~2,5 км друг от друга, закрепление 13/10/9/8.
# Цикл машины без ожидания = путь туда-обратно / 10 м/с + 200 с (стоянка машины; 30 с манёвра — интервал
# станции, а не время машины); нагрузка станции = машин × 230 / цикл:
#   S1 ≈ 11,1 км, цикл ≈ 2424 с, 13 машин — нагрузка ≈ 1,23 (перегружена: копится очередь);
#   S2 ≈ 11,4 км, цикл ≈ 2481 с, 10 машин — ≈ 0,93;
#   S3 ≈ 13,6 км, цикл ≈ 2913 с,  9 машин — ≈ 0,71;
#   S4 ≈ 13,8 км, цикл ≈ 2960 с,  8 машин — ≈ 0,62.
# Так рекомендации имеют смысл: машины перегруженной S1 перебрасываются на соседние S2/S3.

[rules]
service_seconds = 200      # обслуживание одной машины
maneuver_seconds = 30      # манёвр между машинами
speed_kmh = 36.0           # расчётная скорость движения
zone_radius_m = 50.0       # радиус станции и точки разгрузки
stopped_speed_kmh = 1.0    # порог «машина стоит» (строго меньше)
decision_radius_m = 1500.0 # радиус принятия решения до своей станции
horizon_seconds = 1800     # горизонт очереди
freshness_seconds = 30     # позиция свежая, если не старше
min_gain_seconds = 60      # минимальный выигрыш для рекомендации

[unload_point]
lat = 49.1400
lon = 142.6600

[[stations]]
station_id = "S1"
location = { lat = 49.2400, lon = 142.6600 }

[[stations]]
station_id = "S2"
location = { lat = 49.2400, lon = 142.6950 }

[[stations]]
station_id = "S3"
location = { lat = 49.2620, lon = 142.6600 }

[[stations]]
station_id = "S4"
location = { lat = 49.2620, lon = 142.6950 }

[assignments]
