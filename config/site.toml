# Конфигурация площадки сервиса виртуальных очередей.
#
# [rules]        — константы расчёта из ТЗ (время в секундах, скорость в км/ч, расстояния в метрах).
# [unload_point] — координаты единственной точки разгрузки (WGS84).
# [[stations]]   — станции: идентификатор и координаты (WGS84).
# [assignments]  — закрепление машин за своими станциями: unit_uuid = station_uuid.
#
# Расстояния до точки разгрузки по прямой: S1 ≈ 2002 м, S2 ≈ 2606 м, S3 ≈ 2034 м, S4 ≈ 2606 м.

[rules]
service_seconds = 200      # обслуживание одной машины
maneuver_seconds = 30      # манёвр между машинами
speed_kmh = 36.0           # расчётная скорость движения
zone_radius_m = 50.0       # радиус станции и точки разгрузки
stopped_speed_kmh = 1.0    # порог «машина стоит» (строго меньше)
decision_radius_m = 1500.0 # радиус принятия решения до своей станции
horizon_seconds = 1800     # горизонт очереди
freshness_seconds = 30     # позиция свежая, если не старше
min_gain_seconds = 60      # минимальный выигрыш для рекомендации

[unload_point]
lat = 49.1400
lon = 142.6600

[[stations]]
station_id = "S1"
location = { lat = 49.1580, lon = 142.6600 }

[[stations]]
station_id = "S2"
location = { lat = 49.1450, lon = 142.6950 }

[[stations]]
station_id = "S3"
location = { lat = 49.1220, lon = 142.6550 }

[[stations]]
station_id = "S4"
location = { lat = 49.1350, lon = 142.6250 }

[assignments]
