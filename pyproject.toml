[project]
name = "vqueue"
version = "0.1.0"
description = "Сервис виртуальных очередей к станциям по потоку телеметрии из Kafka"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.poetry]
packages = [{ include = "vqueue", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
