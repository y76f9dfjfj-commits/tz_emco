[project]
name = "vqueue"
version = "0.1.0"
description = "Сервис виртуальных очередей к станциям по потоку телеметрии из Kafka"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic (>=2.13.5,<3.0.0)", "confluent-kafka (>=2.16.0,<3.0.0)"]

[tool.poetry]
packages = [{ include = "vqueue", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.168.5,<7.0.0)",
    "bandit[toml] (>=1.9.4,<2.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PL", "RUF", "D"]
# RUF001–003: кириллица в строках, docstring и комментариях — штатная ситуация, не «confusables».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# В тестах магические числа — это ожидаемые значения из ТЗ.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: тесты с реальным Kafka-брокером"]

[tool.coverage.run]
source = ["vqueue"]
branch = true
# Тонкие точки входа (сборка процессов, CLI, сигналы) покрываются интеграционным тестом с Kafka.
omit = ["*/vqueue/processor_main.py", "*/vqueue/simulator/generator_main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
