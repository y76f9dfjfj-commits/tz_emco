# Публикация образа — только вручную: Actions → Release → Run workflow, в «Use workflow from»
# выбрать тег версии vX.Y.Z. Тег сам по себе ничего не публикует — это метка версии.
# Результат: ghcr.io/<owner>/<repo>:X.Y.Z, для стабильных версий также :latest; платформы
# linux/amd64 и linux/arm64. Перед публикацией — полный CI (тот же workflow, что на push).
# Аутентификация — встроенный GITHUB_TOKEN.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Права вызываемого workflow не могут превышать выданные здесь: secrets-history
    # запрашивает pull-requests: read. packages: write проверкам не выдаётся.
    permissions:
      contents: read
      pull-requests: read

  image:
    name: Образ в GHCR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Тег v1.2.3 -> 1.2.3; latest=auto ставит latest только стабильным semver-версиям
          # (не v1.2.3-rc.1).
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
